services:
  app:
    build: .
    container_name: leads-tracking-app
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - NODE_ENV=production
      - DB_PATH=/app/data/leads.db
      - BASIC_AUTH_ENABLED=true
      - BASIC_AUTH_USER=admin
      - BASIC_AUTH_PASSWORD=admin123
    volumes:
      - leads-data:/app/data
    restart: unless-stopped

volumes:
  leads-data:
